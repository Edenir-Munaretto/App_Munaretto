services:
  - type: web
    name: app-munaretto
    # Usa Docker para que o LibreOffice seja instalado via Dockerfile
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,https://app-munaretto-sand.vercel.app"

services:
  - type: web
    name: app-munaretto
    # Usa Docker para que o LibreOffice seja instalado via Dockerfile
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
